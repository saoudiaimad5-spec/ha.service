<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة | H&A Service</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="admin-bg"><main class="login-wrap"><a class="logo darklogo" href="/"><b>H<span>&amp;</span>A</b><small>SERVICE</small></a><h1>لوحة إدارة المكتب</h1><p>سجّل الدخول لمتابعة الطلبات وتحديث حالتها.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="login-form"><label>اسم المستخدم<input name="username" required autocomplete="username" value="admin"></label><label>كلمة المرور<input type="password" name="password" required autocomplete="current-password"></label><button class="btn gold submit">تسجيل الدخول</button></form></main></body></html>
