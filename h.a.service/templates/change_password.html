<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة المرور</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="admin-bg"><main class="login-wrap"><a class="logo darklogo" href="/"><b>H<span>&amp;</span>A</b><small>SERVICE</small></a><h1>تغيير كلمة المرور</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="login-form"><label>كلمة المرور الحالية<input type="password" name="current_password" required></label><label>كلمة المرور الجديدة (12 حرفًا على الأقل)<input type="password" name="new_password" minlength="12" required></label><button class="btn gold submit">حفظ كلمة المرور</button></form><a href="{{ url_for('admin_dashboard') }}">العودة إلى لوحة الإدارة</a></main></body></html>
